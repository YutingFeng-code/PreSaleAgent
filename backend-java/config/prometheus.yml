global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: presaleagent-java
    environment: production

scrape_configs:
  - job_name: presaleagent-java-app
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - presaleagent-java:8080
        labels:
          service: presaleagent-java

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
