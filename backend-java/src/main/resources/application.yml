server:
  port: ${SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force-request: true
      force-response: true

spring:
  application:
    name: presale-agent-java
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:anthropic}
  jackson:
    property-naming-strategy: SNAKE_CASE
  mvc:
    pathmatch:
      matching-strategy: ANT_PATH_MATCHER
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${PRESALEAGENT_REDIS_PASSWORD:${REDIS_PASSWORD:${ECHOMIND_REDIS_PASSWORD:presaleagent123}}}
      timeout: 2s
  ai:
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:${LLM_STARTUP_API_KEY:presaleagent-local-placeholder}}
      base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
      chat:
        options:
          model: ${ANTHROPIC_MODEL:claude-3-5-sonnet-20241022}
          temperature: 0.2
          max-tokens: 1024
    vectorstore:
      # 默认不创建需要 EmbeddingModel 的 Chroma Bean；配置向量模型后设为 chroma。
      type: ${PRESALEAGENT_VECTORSTORE_TYPE:none}
      chroma:
        client:
          host: ${CHROMA_HOST:http://localhost}
          port: ${CHROMA_PORT:8001}
        collection-name: ${PRESALEAGENT_CHROMA_COLLECTION:${ECHOMIND_CHROMA_COLLECTION:presaleagent_knowledge}}
        initialize-schema: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs

presaleagent:
  llm:
    fallback-enabled: ${LLM_FALLBACK_ENABLED:true}
  memory:
    ttl-seconds: ${PRESALEAGENT_MEMORY_TTL_SECONDS:${MEMORY_TTL_SECONDS:${ECHOMIND_MEMORY_TTL_SECONDS:86400}}}
    working-max: ${PRESALEAGENT_MEMORY_WORKING_MAX:${MEMORY_WORKING_MAX:${ECHOMIND_MEMORY_WORKING_MAX:20}}}
    compress-at: ${PRESALEAGENT_MEMORY_COMPRESS_AT:${MEMORY_COMPRESS_AT:${ECHOMIND_MEMORY_COMPRESS_AT:15}}}
  rag:
    top-k: ${RAG_TOP_K:4}
    bm25-weight: ${RAG_BM25_WEIGHT:0.45}
    vector-weight: ${RAG_VECTOR_WEIGHT:0.55}
  storage:
    data-dir: ${PRESALEAGENT_DATA_DIR:${ECHOMIND_DATA_DIR:data/java}}
    knowledge-path: ${PRESALEAGENT_KNOWLEDGE_STORE_PATH:${KNOWLEDGE_STORE_PATH:${PRESALEAGENT_DATA_DIR:${ECHOMIND_DATA_DIR:data/java}}/knowledge-store.json}}
    memory-path: ${PRESALEAGENT_MEMORY_STORE_PATH:${MEMORY_STORE_PATH:${PRESALEAGENT_DATA_DIR:${ECHOMIND_DATA_DIR:data/java}}/memory-store.json}}
  monitor:
    success-rate-threshold: ${MONITOR_SUCCESS_RATE_THRESHOLD:0.90}
    latency-ms-threshold: ${MONITOR_LATENCY_MS_THRESHOLD:3000}
    webhook-url: ${ALERT_WEBHOOK_URL:}
  eval:
    baseline-path: ${EVAL_BASELINE_PATH:data/eval/baseline.json}
  skills:
    root-dir: ${PRESALEAGENT_SKILLS_DIR:${ECHOMIND_SKILLS_DIR:skills}}
    max-prompt-chars: ${PRESALEAGENT_SKILLS_MAX_PROMPT_CHARS:${ECHOMIND_SKILLS_MAX_PROMPT_CHARS:5000}}
  context:
    max-tokens: ${PRESALEAGENT_CONTEXT_MAX_TOKENS:8192}
    compact-threshold: ${PRESALEAGENT_CONTEXT_COMPACT_THRESHOLD:0.75}
    tail-messages: ${PRESALEAGENT_CONTEXT_TAIL_MESSAGES:5}
    compaction-timeout-seconds: ${PRESALEAGENT_COMPACTION_TIMEOUT_SECONDS:10}
  catalog:
    cache-seconds: ${PRESALEAGENT_CATALOG_CACHE_SECONDS:30}
  tools:
    max-calls-per-request: ${PRESALEAGENT_TOOL_MAX_CALLS_PER_REQUEST:1}

---
spring:
  config:
    activate:
      on-profile: deepseek
  autoconfigure:
    exclude:
      - org.springframework.ai.model.anthropic.autoconfigure.AnthropicChatAutoConfiguration
  ai:
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:${LLM_STARTUP_API_KEY:presaleagent-local-placeholder}}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        options:
          model: ${DEEPSEEK_MODEL:deepseek-chat}
          temperature: ${DEEPSEEK_TEMPERATURE:0.2}
          max-tokens: ${DEEPSEEK_MAX_TOKENS:1024}

---
spring:
  config:
    activate:
      on-profile: anthropic
  autoconfigure:
    exclude:
      - org.springframework.ai.model.deepseek.autoconfigure.DeepSeekChatAutoConfiguration
